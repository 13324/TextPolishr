name: Bug report
description: Report a reproducible Text Polishr problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys and sensitive document text before submitting.
  - type: input
    id: version
    attributes:
      label: Text Polishr version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target application
      placeholder: Word, Outlook, Chrome, Notepad, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed API keys and confidential text from this report.
          required: true
