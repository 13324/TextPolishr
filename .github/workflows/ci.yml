name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TextPolishr.slnx

      - name: Verify formatting
        run: dotnet format TextPolishr.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build TextPolishr.slnx -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/TextPolishr.Tests/TextPolishr.Tests.csproj -c Release --no-build
